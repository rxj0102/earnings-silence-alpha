[project]
name = "earnings-silence-alpha"
version = "0.1.0"
description = "Research code for earnings-silence-alpha"
requires-python = ">=3.11"
dependencies = [
    'numpy>=1.24.0',
    'pandas>=2.0.0',
    'scipy>=1.11.0',
    'scikit-learn>=1.3.0',
    'statsmodels>=0.14.0',
    'nltk>=3.8.1',
    'wordcloud>=1.9.2',
    'yfinance>=0.2.31',
    'requests>=2.31.0',
    'beautifulsoup4>=4.12.0',
    'lxml>=4.9.3',
    'matplotlib>=3.7.0',
    'seaborn>=0.13.0',
    'jupyter>=1.0.0',
    'ipykernel>=6.25.0',
    'ipywidgets>=8.1.0',
    'tqdm>=4.66.0',
    'pickle5>=0.0.12; python_version < "3.8"',
    'pytest>=7.0'
]

[dependency-groups]
dev = ["pytest>=7.4"]

[tool.uv]
package = false
